# goreleaser config — https://goreleaser.com
# build & publish plbx for macOS and Linux on tag push.
# test locally without publishing: `make release-check`.
version: 2

project_name: planterbox

before:
  hooks:
    - go mod tidy

builds:
  - id: plbx
    binary: plbx
    main: ./cmd/plbx
    env:
      - CGO_ENABLED=0
    # inject the version into the same symbol the Makefile uses.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # plbx autostarts plbxd from beside itself, so the two ship together and
  # from the same build. A plbx that cannot find its daemon cannot run a
  # sandbox at all.
  - id: plbxd
    binary: plbxd
    main: ./cmd/plbxd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: plbx
    ids: [plbx, plbxd]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE.md

checksum:
  name_template: checksums.txt

changelog:
  # build release notes from the git log, grouped by conventional-commit type.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^docs'
      - '^test'
      - '^ci'
      - '^Merge '

release:
  # 0.x / pre-release tags (e.g. v0.1.0-rc1) are flagged automatically.
  prerelease: auto
  draft: false

homebrew_casks:
  - name: plbx
    # publish only when a tap token is configured; otherwise skip so a
    # release never fails for a missing secret.
    #
    # `index .Env` rather than `.Env.HOMEBREW_TAP_TOKEN`: the latter errors on a
    # variable that is absent rather than reading as empty, so a local
    # `make release-check` failed here on a machine with no tap token — which is
    # every machine, that being the point of a dry run.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/rhizomatous/planterbox
    description: a Nix-based sandbox for running coding agents in isolated containers
    # both binaries get linked onto $PATH. plbx prefers the plbxd beside itself
    # and only falls back to $PATH, but a cask that links plbx alone leaves the
    # daemon unreachable by either route.
    binaries:
      - plbx
      - plbxd
    # the binaries are unsigned/unnotarized; strip the quarantine flag so macOS
    # doesn't refuse to run them after a brew install. the whole staged
    # directory, so the daemon is covered too.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end
    repository:
      owner: rhizomatous
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
