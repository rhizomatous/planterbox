version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nakedret
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace

  settings:
    depguard:
      rules:
        presentation:
          files:
            - "**/cmd/plbx/**"
            - "**/internal/tui/**"
          deny:
            - pkg: github.com/rhizomatous/planterbox/internal/runner
              desc: go through api.Service instead
            - pkg: github.com/rhizomatous/planterbox/internal/store
              desc: go through api.Service instead

  exclusions:
    generated: lax
    rules:
      # some test helpers legitimately have unused params
      - path: _test\.go
        linters:
          - unparam
      # test funcs (TestXxx) don't need exported-style doc comments
      - path: _test\.go
        linters:
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rhizomatous/planterbox
