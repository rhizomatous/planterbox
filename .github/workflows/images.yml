name: images

# builds and publishes the sandbox images to ghcr.io.
#
# fork-safety:
#   - `pull_request` builds every image but pushes none, so a run from a fork
#     gets a read-only token and never touches the registry.
#   - `packages: write` is granted only to this job, and only off a pull request.
#   - actions are pinned to a commit SHA, as elsewhere in this repo.
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "cmd/plbx-relay/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [main]
    paths:
      - "images/**"
      - "cmd/plbx-relay/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  # publishing at release time is a manual step, since a path-filtered push
  # trigger cannot also fire on tags.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        agent: [shell, claude, codex, opencode]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/plbx-${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build ${{ matrix.agent }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images
          target: ${{ matrix.agent }}
          # Intel and Apple silicon macs, and both common Linux architectures.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the base stage is shared, so the first target in the matrix warms
          # the cache the rest reuse.
          cache-from: type=gha,scope=plbx-images
          cache-to: type=gha,mode=max,scope=plbx-images

  # the relay is built separately from the agent images: it compiles Go from
  # the repository root, so it needs the whole tree as its context rather than
  # images/ alone.
  relay:
    name: relay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/plbx-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build relay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/Dockerfile
          target: relay
          # no QEMU: the build stage runs natively and Go cross-compiles.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=plbx-relay
          cache-to: type=gha,mode=max,scope=plbx-relay
